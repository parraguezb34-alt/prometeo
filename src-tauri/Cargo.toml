[package]
name = "lienzo"
version = "1.0.152"
description = "Prometeo: centro de mando para dirigir un equipo de agentes de IA"
authors = ["Prometeo"]
edition = "2024"
# Two binaries ship together: the app and the MCP bridge for agents.
default-run = "lienzo"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Prometeo Dev (`npm run dev:app`): la versión de desarrollo, con sus datos aparte.
dev = []

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lienzo_lib"
# Desktop-only build: `cdylib` triggers "export ordinal too large" from
# MinGW's ld on windows-gnu. `cdylib`/`staticlib` are only needed for mobile.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
# Leer .docx/.xlsx/.pptx (son zips) en la pestaña App.
flate2 = "1"
tiny_http = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
getrandom = "0.3"
# Lectura de opencode.db (telemetría de contexto de OpenCode vía SQLite).
rusqlite = { version = "0.37", features = ["bundled"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
web-push-native = { version = "0.5", default-features = false, features = ["serialization", "vapid"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
